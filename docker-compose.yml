services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: olinck
      POSTGRES_USER: olinck
      POSTGRES_PASSWORD: olinck
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olinck -d olinck"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://olinck:olinck@postgres:5432/olinck
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${USERPROFILE}/.postgresql/root.crt:/root/.postgresql/root.crt:ro
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
